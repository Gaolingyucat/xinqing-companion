{% extends "app_base.html" %}

{% block app_title %}心晴陪伴 - 呼吸练习{% endblock %}

{% block app_content %}
<section class="app-mobile-header app-header-gap">
  <p class="app-mobile-brand">心晴陪伴</p>
  <h1>呼吸练习</h1>
  <p class="app-card-desc">跟着节奏慢一点。</p>
</section>

<section class="app-card app-breath-wrap app-animate-card" id="breathWrap" data-duration="60">
  <div class="breath-circle" id="breathCircle">
    <span id="breathText">准备开始</span>
  </div>
  <p class="app-overview-time" id="breathCountdown">剩余 60 秒</p>
  <div class="app-action-row">
    <button class="app-primary-action app-btn" id="breathStartBtn" type="button">开始</button>
    <button class="app-secondary-action app-btn" id="breathPauseBtn" type="button">暂停</button>
  </div>
  <p class="app-finish-text" id="breathFinishText" hidden>🏅 完成一次小小放松</p>
</section>
{% endblock %}

{% block app_scripts %}
<script src="{{ url_for('static', filename='js/breath.js') }}"></script>
{% endblock %}
