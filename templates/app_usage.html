{% extends "app_base.html" %}

{% block app_title %}心晴陪伴 - 使用说明{% endblock %}

{% block app_content %}
<section class="app-mobile-header app-header-gap">
  <p class="app-mobile-brand">心晴陪伴</p>
  <h1>使用说明</h1>
  <p class="app-card-desc">这里是情绪陪伴空间，不需要把自己逼得太紧。</p>
</section>

<section class="app-card">
  <p class="app-card-desc">心晴陪伴不提供医疗诊断、心理治疗或疾病判断，也不能替代专业帮助。</p>
  <p class="app-card-desc">如果你出现强烈痛苦、伤害自己的想法，或担心自己处于危险中，请及时联系身边可信任的人或当地紧急求助资源。</p>
</section>
{% endblock %}
